{% extends "base.html" %}
{% import "bootstrap_wtf.html" as wtf %}

{% block content %}
    <h1>{{ _('Edit Post') }}</h1>
    {{ wtf.quick_form(form) }}
    <form action="{{ url_for('main.delete_post', id=post.id) }}" method="post">
        {{ form.hidden_tag() }}
        {{ form.submit(value=_('Delete Post'), class_='btn btn-danger') }}
    </form>
{% endblock %}
